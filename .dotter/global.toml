##
## One tree, all machines.
##
## Two roots:
##   files/            anything that gets placed somewhere. Every entry below claims one.
##   .hooks/<pkg>/     anything that gets *run* on deploy, if <pkg> is selected.
##
## A machine is a composition of packages, declared in .dotter/machines/<name>.toml.
## What differs per machine lives in that file, not here.
##
## Directories are linked WHOLE (recurse = false) on purpose: it is the only mode where a
## file an app writes into the target lands back in this repo unaided. Never add a separate
## entry for a file inside a whole-linked directory — that path deletes the source.
##

[settings]
default_target_type = "symbolic"

# ---------------------------------------------------------------- shell

[shell.files]
"files/shell/profile" = "~/.profile"
"files/shell/zprofile" = "~/.zprofile"
"files/shell/bashrc" = "~/.bashrc"
"files/shell/zshrc" = "~/.zshrc"
"files/shell/bash_profile" = "~/.bash_profile"
"files/shell/shared.sh" = "~/.config/shell/shared.sh"
"files/zsh/completions" = { target = "~/.zsh/completions", type = "symbolic", recurse = false }

# The per-machine shell fragment. Every machine file overrides these two to point at its
# own pair under files/shell/machines/. Sourced at the end of .profile / .bashrc / .zshrc.
# This is the include, not a template — see DESIGN.md, "Include vs. template".

# ---------------------------------------------------------------- editors

[nvim.files]
"files/nvim" = { target = "~/.config/nvim", type = "symbolic", recurse = false }

[vim.files]
"files/vimrc" = "~/.vimrc"

# ---------------------------------------------------------------- vcs

[git.files]
"files/git" = { target = "~/.config/git", type = "symbolic", recurse = false }

# ---------------------------------------------------------------- terminal

[tmux.files]
"files/tmux" = "~/.config/tmux"

[ghostty.files]
"files/ghostty" = { target = "~/.config/ghostty", type = "symbolic", recurse = false }

# ---------------------------------------------------------------- secrets-adjacent

[ssh.files]
"files/ssh/config" = "~/.ssh/config"

[gnupg.files]
"files/gnupg/gpg-agent.conf" = "~/.gnupg/gpg-agent.conf"
"files/gnupg/gpg-public-key.asc" = "~/.gnupg/gpg-public-key.asc"

# ---------------------------------------------------------------- ai agents
# All three are app-managed: they rewrite lockfiles and settings in place.

[agents.files]
"files/agents" = { target = "~/.agents", type = "symbolic", recurse = false }
"files/codex/config.toml" = "~/.codex/config.toml"
"files/opencode" = "~/.config/opencode"

# ---------------------------------------------------------------- assorted cli tools

[cli-tools.files]
"files/bun/bunfig.toml" = "~/.bunfig.toml"
"files/broot" = { target = "~/.config/broot", type = "symbolic", recurse = false }
"files/lazygit" = { target = "~/.config/lazygit", type = "symbolic", recurse = false }
"files/radian" = { target = "~/.config/radian", type = "symbolic", recurse = false }
"files/rstudio" = { target = "~/.config/rstudio", type = "symbolic", recurse = false }
"files/cargo/config.toml" = "~/.cargo/config.toml"
"files/cargo/binstall.toml" = "~/.cargo/binstall.toml"
"files/cargo/crates.toml" = "~/.cargo/.crates.toml"
"files/sqliterc" = "~/.sqliterc"
"files/mise/config.toml" = "~/.config/mise/config.toml"
"files/mise/mise.lock" = "~/.config/mise/mise.lock"
"files/prettyping" = { target = "/usr/bin/prettyping", type = "symbolic", owner = "root" }

# mc is split rather than whole-linked: its two files go to different places, and one of
# them is outside $HOME.
[mc.files]
"files/mc/mc.keymap" = "~/.config/mc/mc.keymap"
"files/mc/mc.vim.keymap" = { target = "/etc/mc/mc.vim.keymap", type = "symbolic", owner = "root" }

# ---------------------------------------------------------------- linux only

[systemd.files]
"files/systemd" = { target = "~/.config/systemd", type = "symbolic", recurse = false }

# ---------------------------------------------------------------- windows only
# Targets that are not $HOME-relative are resolved live from the environment so that GPO
# folder redirection and OneDrive known-folder move stay correct. The :- fallback is
# mandatory: an unset variable aborts config loading on every *other* OS.

[windows.files]
"files/windows/auto-hotkey" = { target = "~/auto-hotkey", type = "symbolic", recurse = false }
"files/windows/security-crypto" = { target = "~/security-crypto", type = "symbolic", recurse = false }
"files/windows/msys-profile" = "~/.msys-profile"
"files/windows/msys2.conf" = "~/.msys2.conf"
"files/windows/nsswitch.conf" = "~/.nsswitch.conf"
"files/windows/windowsterm-settings.jsonc" = "${LOCALAPPDATA:-/nonexistent}/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"
"files/windows/archlinux.ico" = "${LOCALAPPDATA:-/nonexistent}/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/archlinux.ico"
"files/windows/azurestorage-explorer-settings.json" = "${APPDATA:-/nonexistent}/StorageExplorer/settings.json"
"files/windows/wslconfig" = "~/.wslconfig"

[wsl.files]
"files/wsl/wsl.conf" = { target = "/etc/wsl.conf", type = "symbolic", owner = "root" }
"files/wsl/WSLInterop.conf" = { target = "/etc/binfmt.d/WSLInterop.conf", type = "symbolic", owner = "root" }


[arch.files]
"files/arch/yay/config.json" = "~/.config/yay/config.json"

# ---------------------------------------------------------------- script-only packages
# A package with no files is legal: `files` is #[serde(default)]. These exist purely so a
# machine can select the matching .hooks/<name>/ directory.

[certs.files]
[npm.files]
[mac.files]

[bin.files]
"files/bin/restore-nvim-session" = "~/.local/bin/restore-nvim-session"
"files/bin/restore-vim-session" = "~/.local/bin/restore-vim-session"
