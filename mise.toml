[tasks.validate-windowsterm]
description = "Validate Windows Terminal JSONC and find live settings"
run = "bun run scripts/validate-windowsterm.ts"

[tasks.check]
description = "Run the TypeScript and Biome checks"
run = "bun run check"

[tasks.bootstrap]
description = "Install mise tools and register prek Git hooks"
run = ["mise install", "prek install --prepare-hooks"]

[tasks.soundcore-q20i]
description = "Enable Windows Bluetooth and open Soundcore Q20i settings"
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/connect-soundcore-q20i.ps1"

[tasks.clear-gpg]
description = "Foloseste cand ti-a expirat cache-u de gpg-agent si-ti trebuie iara passphraseu"
run = "echo test | gpg --clearsign"
