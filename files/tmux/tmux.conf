# ==========================================
# Configuration Reload
# ==========================================
set -g @config_file "~/.config/tmux/tmux.conf"

bind r run-shell "tmux source-file '#{@config_file}'" \; display-message "Am dat reload la configgu de tmux din fisieru #{@config_file} !!"

# ==========================================
# General Settings
# ==========================================
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -sa terminal-features ",$TERM:RGB"
# Let applications forward OSC 52 copies through tmux.
# normal dacă ceva îți scrie în clipboardu de windows, o face direct, nu prin terminal codes speciale.
set -s set-clipboard on

#vreau pe alt+b ca-i mai ergonomic
unbind C-b
set-option -g prefix M-b

# Allow sending it to other apps by pressing it twice
bind-key M-b send-prefix

# Kill session shortcut
bind X kill-session

# Easier and faster switching between next/prev window
bind M-p previous-window
bind M-n next-window
bind b last-window



# ==========================================
# Vi Copy Mode Keybindings
# ==========================================
setw -g mode-keys vi

# Visual mode selections (Vim style)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi V send -X select-line

# Vim Viewport Positioning (zz, zt, zb) via sub-key table
bind-key -T copy-mode-vi z switch-client -T multi-z
bind-key -T multi-z z send -X scroll-middle
bind-key -T multi-z t send -X scroll-top
bind-key -T multi-z b send -X scroll-bottom

# Yanking and clear behaviors
bind-key -T copy-mode-vi y send -X copy-selection-no-clear \; send -X clear-selection
bind-key -T copy-mode-vi Enter send -X copy-selection-no-clear \; send -X clear-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear \; send-keys -X clear-selection
bind-key -T copy-mode-vi Escape send -X clear-selection
bind-key -T copy-mode-vi C-[ send -X clear-selection

#Sa se deschida tab nou in acelasi path in care erai inainte.
bind c new-window -c "#{pane_current_path}"


## make it pretty

## Ensure full 24-bit truecolor support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Copy & clock mode (warm ember / raw silk)
setw -g clock-mode-colour "#eed49f"
setw -g mode-style "fg=#181825 bg=#fab387 bold"

## Panes (subtle dark border, glowing copper active border)
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#fab387"

## Status bar layout
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#cdd6f4 bg=#181825"

## Left pill (Session name badge)
set -g status-left-length 25
set -g status-left "#[fg=#11111b,bg=#fab387,bold] #S #[fg=#fab387,bg=#181825,nobold] "

## Right widgets (clean date and clock)
set -g status-right-length 50
set -g status-right "#[fg=#6c7086,bg=#181825]%b %d #[fg=#313244]• #[fg=#eed49f,bg=#181825]%H:%M "

## Window tabs: Inactive (muted gray on soft dark surface)
setw -g window-status-style "fg=#a6adc8 bg=#1e1e2e"
setw -g window-status-format "#[fg=#6c7086]#I#[fg=#a6adc8] #W #[fg=#6c7086]#F"

## Window tabs: Active (warm copper background with deep dark text)
setw -g window-status-current-style "fg=#11111b bg=#fab387 bold"
setw -g window-status-current-format "#I #W"

## Command prompt / messages
set -g message-style "fg=#fab387 bg=#1e1e2e bold"


#--------------


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'guysoft/tmux-resurrect-opencode-sessions'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-ai-cli-save.sh'

set -g @resurrect-processes '\
  "~/usr/bin/nvim->$HOME/.local/bin/restore-nvim-session" \
  "lazygit" \
  "~codex --yolo->codex *" \
  "~codex" \
  "copilot" \
  "agy" \
'

set -as terminal-features ",*:hyperlinks"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
