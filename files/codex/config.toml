# Authored settings only.
#
# codex also writes into this file: one [projects."/abs/path"] trust table per
# directory it has ever been opened in, plus [notice*] and
# [tui.model_availability_nux]. Those are per-machine by construction and are
# deliberately not tracked here — let codex re-create them locally.

model = "gpt-5.6-sol"
model_reasoning_effort = "low"
personality = "pragmatic"
approvals_reviewer = "user"
fast_default_opt_out = true
web_search = "live"  # fetch the most recent data (same as --search)

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining"]


[mcp_servers.complaints]
command = "/mnt/c/Users/istan/repos-projects/companion/mcp_bridge/development/rust_mcp_servers/target/debug/complaints-mcp-server"
args = ["/mnt/c/Users/istan/repos-projects/integrity-extractor/extracts/fulls/73k-entries-130cols.parquet"]


[plugins."github@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true


[plugins."documents@openai-primary-runtime"]
enabled = true


[plugins."pdf@openai-primary-runtime"]
enabled = true


[plugins."spreadsheets@openai-primary-runtime"]
enabled = false


[plugins."presentations@openai-primary-runtime"]
enabled = false


[plugins."computer-use@openai-bundled"]
enabled = true


[plugins."chrome@openai-bundled"]
enabled = true


[plugins."template-creator@openai-primary-runtime"]
enabled = false


[plugins."ponytail@ponytail"]
enabled = true


[plugins."codex-security@openai-curated"]
enabled = true

[projects."/home/istan"]
trust_level = "trusted"

[projects."/home/istan/repos-projects/follow-pro-fm"]
trust_level = "trusted"

[projects."/home/istan/.dotfiles"]
trust_level = "trusted"

[notice.model_migrations]
"gpt-5.4" = "gpt-5.6-terra"



