promptToReturnFromSubprocess: false

git:
  overrideGpg: true
  diffRenderers:
    - command: delta --dark --paging=never --line-numbers
commit:
  gpgsign: true
gui:
  nerdFontsVersion: "3"
  showCommandLog: false
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 4
  shrinkSidePanelsToContent: true
os:
  openDirInEditor: "nvim"
keybinding:
  universal:
    # lazygit only defaults backspaceWord to <alt+backspace> on macOS; on Linux
    # it's <ctrl+backspace> only, which Windows Terminal doesn't send. Bind both.
    backspaceWord:
      - <alt+backspace>
      - <ctrl+backspace>
