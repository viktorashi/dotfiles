[tools]
github-cli = "latest"
flyctl = "latest"
node = "latest"
npm = "latest"
pnpm = "latest"
uv = "latest"
bun = "latest"
go = "latest"
"npm:typescript" = "latest"
"npm:@types/bun" = "latest"

# Editor language servers. LazyVim configures these and resolves them from PATH.
lua-language-server = "latest"
marksman = "latest"
taplo = "latest"
"github:latex-lsp/texlab" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:svelte-language-server" = "latest"
"npm:typescript-svelte-plugin" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"pipx:pyrefly" = "latest"
ruff = "latest"
ty = "latest"

# Editor formatters, linters, and parser tooling.
rumdl = "latest"
stylua = "latest"
golangci-lint = "latest"
shellcheck = "latest"
gofumpt = "latest"
shfmt = "latest"
tree-sitter = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
biome = "latest"
prek = "latest"

# Keep rustup's Cargo bin directory after standalone Mise tools on PATH.
rust = { version = "latest", profile = "default", components = [
  "rust-analyzer",
] }
clang = "latest"
"conda:clangxx" = "latest"
"conda:clang-tools" = "latest"
cmake = "latest"
ninja = "latest"
ccache = "latest"
conan = "latest"
"github:ltex-plus/ltex-ls-plus" = "latest"
"pipx:esbonio" = "latest"
"pipx:rstcheck" = "latest"

[settings]
lockfile = true
minimum_release_age = "3d"
idiomatic_version_file_enable_tools = ["node", "rust", "python"]
experimental = true

[settings.npm]
package_manager = "bun"

[env]
BUN_OPTIONS = "--bun"

[bootstrap.mise_shell_activate]
zshrc = false
