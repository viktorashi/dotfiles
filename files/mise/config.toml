[tools]
github-cli = "latest"
node = "latest"
npm = "latest"
pnpm = "latest"
uv = "latest"
bun = "latest"
go = "latest"
"npm:typescript" = "latest"
"npm:@types/bun" = "latest"

# Editor language servers. LazyVim configures these and resolves them from PATH.
"aqua:LuaLS/lua-language-server" = "latest"
"aqua:artempyanykh/marksman" = "latest"
"aqua:tamasfe/taplo" = "latest"
"github:latex-lsp/texlab" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:svelte-language-server" = "latest"
"npm:typescript-svelte-plugin" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"pipx:pyrefly" = "latest"
"pipx:ruff" = "latest"
"pipx:ty" = "latest"

# Editor formatters, linters, and parser tooling.
rumdl = "latest"
"aqua:JohnnyMorganz/StyLua" = "latest"
"aqua:golangci/golangci-lint" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:mvdan/gofumpt" = "latest"
"aqua:mvdan/sh" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"npm:@biomejs/biome" = "latest"

# Keep rustup's Cargo bin directory after standalone Mise tools on PATH.
rust = { version = "latest", profile = "default", components = ["rust-analyzer"] }

[settings]
lockfile = true
minimum_release_age = "3d"
idiomatic_version_file_enable_tools = ["node", "go", "rust", "python"]

[settings.npm]
package_manager = "bun"

[env]
BUN_OPTIONS = "--bun"

[bootstrap.mise_shell_activate]
zshrc = false
